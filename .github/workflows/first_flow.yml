name: Run JS tests on Linux

on: 
  push:
    branches:
      main

  pull_request:
    branches:
      main

  workflow_dispatch:
  
  schedule:
   - cron: '30 5 * * 1'
    
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz
          tar -zxvf allure-2.33.0.tgz
          sudo mv allure-2.33.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Install dependencies
        run: |
          npm ci

      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys:
            allure-history-${{ github.ref_name }}-

      - name: Debug restored history
        run: |
          echo "=== allure-history ==="
          ls -la allure-history || true

          echo "=== allure-results/history ==="
          ls -la allure-results/history || true
      
      - name: Prepare Allure history
        run: |
          if [ -d "allure-history" ]; then
            mkdir -p allure-results/history
            cp -R allure-history/. allure-results/history/
          fi

      - name: Debug prepared history
        run: |
          echo "=== allure-results/history ==="
          find allure-results/history -maxdepth 2 -type f -print || true        

      - name: Run tests with Mocha + Allure
        run: |
          npm test

      - name: Configure Allure environment
        if: always()
        run: |
            cat > allure-results/environment.properties << EOF
            execution = GitHub Actions
            os_platform = Linux
            os_version = Ubuntu
            node_version = $(node --version)
            browser = Chrome
            EOF

      - name: Configure Allure executor
        if: always()
        run: |
          cat > allure-results/executor.json << EOF
          {
            "reportName": "GitHub Actions Allure Report",
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
              
      - name: Generate Allure report
        if: always()
        run: |
          npm run report

      - name: Debug generated history
        if: always()
        run: |
          echo "=== allure-report/history ==="
          find allure-report/history -maxdepth 2 -type f -print || true

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
      
      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report
  
  deploy:
    needs: test
    if: always()

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


